<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fairy Forest</title>
<style>
  /* Art direction: glossy 3D-animated look. Cursed = dark violet with
     bioluminescent cyan/magenta; healed = sunlit meadow, pink flowers. */
  :root {
    --night: #120830; --gold: #ffd166; --cream: #fff8ec;
    --glass: rgba(34, 16, 70, .74); --glassline: rgba(190, 150, 255, .55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--cream);
    font-family: "Avenir Next Rounded", "Avenir Next", "Nunito", "Trebuchet MS", sans-serif; overflow: hidden; }
  #stage { position: relative; width: 100vw; height: 100vh; --p: 0;
    background: linear-gradient(#1a0b3d, #2b1250 60%, #1b0c33); }
  #stage.scene-mountain { background: linear-gradient(#0a1430, #1d3a6b 60%, #101c38); }
  .flake { animation: fall 7s linear infinite; }
  .flake:nth-child(3n) { animation-duration: 9s; animation-delay: -4s; }
  .flake:nth-child(4n+1) { animation-duration: 6s; animation-delay: -2s; }
  .steam { transform-box: fill-box; transform-origin: center; animation: steam 3s ease-out infinite; }
  .steam:nth-child(2) { animation-delay: -1s; } .steam:nth-child(3) { animation-delay: -2s; }
  @keyframes fall { from { transform: translate(0, -260px); } to { transform: translate(-80px, 420px); } }
  @keyframes steam { from { transform: translateY(0) scale(.6); opacity: .8; } to { transform: translateY(-70px) scale(1.6); opacity: 0; } }
  #stage::before { content: ""; position: absolute; inset: 0; opacity: var(--p); transition: opacity 2.5s;
    background: linear-gradient(#c9efff, #5cc540 55%, #2a7426); }
  #scene { position: absolute; left: 0; top: 0; width: 100%; height: 76%; }
  #title { position: absolute; top: 2vh; left: 0; right: 0; text-align: center; z-index: 1;
    font-size: 4.4vh; font-weight: 700; letter-spacing: .14em; color: var(--gold);
    text-shadow: 0 0 18px #ff9de0aa, 0 3px 0 #7a3a10; }
  #bubble { position: absolute; left: 50%; bottom: 3.5vh; transform: translateX(-50%);
    width: min(92vw, 1400px); background: var(--glass); color: #fff; border: 2px solid var(--glassline);
    border-radius: 3vh; padding: 2.5vh 4vw 2.5vh 15vw; font-size: 3.8vh; line-height: 1.3; min-height: 18vh;
    box-shadow: 0 0 40px #b07aff55, 0 10px 40px #0009; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background .4s, border-color .4s; }
  #bubble.wrong { background: rgba(110, 18, 60, .82); border-color: #ff7aa8; animation: shake .5s; }
  #bubble.done { background: linear-gradient(90deg, rgba(255, 120, 200, .85), rgba(255, 200, 90, .85), rgba(120, 220, 255, .85));
    color: #2a0f3a; border-color: #fff; }
  #fairy { position: absolute; left: 1vw; bottom: 3vh; width: 15vw; height: 15vw; z-index: 2;
    animation: float 3.4s ease-in-out infinite; filter: drop-shadow(0 0 14px #8fd8ff); }
  #fairy svg { width: 100%; height: 100%; }
  #fairy .wing { transform-origin: 60px 64px; animation: flap .5s ease-in-out infinite alternate; }
  #fairy .wing.r { animation-delay: .05s; }
  #overlay { position: absolute; inset: 0; background: #120830ee; display: grid; place-items: center;
    font-size: 5vh; text-align: center; cursor: pointer; z-index: 10; }
  #overlay small { display: block; font-size: 2.5vh; opacity: .7; margin-top: 2vh; }
  #hint { position: absolute; right: 1.5vw; top: 1.5vh; font-size: 1.8vh; opacity: .35; z-index: 1; }

  /* healed-ness of the whole world follows progress (--p = healed/5) */
  .lit-bg { opacity: var(--p); transition: opacity 2.5s; }
  .dark-bg { opacity: calc(1 - var(--p)); transition: opacity 2.5s; }

  .zone .lit { opacity: 0; transition: opacity 1.4s; }
  .zone .dark { transition: opacity 1.4s; }
  .zone.healed .lit { opacity: 1; }
  .zone.healed .dark { opacity: 0; }
  .zone .glow { opacity: 0; transition: opacity 1.2s; }
  .zone.healed .glow { opacity: 1; animation: pulse 3s ease-in-out infinite; }
  .zone .label { fill: #d9c9ff; font-size: 30px; font-weight: 700; text-anchor: middle;
    paint-order: stroke; stroke: #1a0b3d; stroke-width: 7px; stroke-linejoin: round; }
  .zone.healed .label { fill: #fff; stroke: #2f7d2a; }
  .zone.just { animation: pop .8s ease-out; transform-box: fill-box; transform-origin: center; }
  .bio { animation: bio 2.6s ease-in-out infinite; }
  .bio:nth-child(2n) { animation-delay: -1.3s; }
  .stream { stroke-dasharray: 18 26; animation: flow .8s linear infinite; }
  #rainbow { opacity: 0; transition: opacity 2s; }
  #stage.done #rainbow { opacity: .8; }
  #stage.done .zone.healed .glow { animation: rainbowglow 3s linear infinite; }
  #stage.shake { animation: shake .5s; }
  .mote { animation: drift 7s ease-in-out infinite; }
  .mote:nth-child(3n) { animation-duration: 9s; animation-delay: -3s; }
  .mote:nth-child(3n+1) { animation-duration: 11s; animation-delay: -6s; }

  /* dragon level: dragon retreats up-right as --p grows, flies off at done */
  #dragon { display: none; transform-origin: 800px 420px; transition: transform 2.5s ease-in-out, opacity 2s;
    transform: translate(calc(var(--p) * 620px), calc(var(--p) * -200px)) scale(calc(1 - var(--p) * .55)); }
  #stage.scene-dragon #dragon { display: inline; }
  #stage.done #dragon { opacity: 0; transform: translate(950px, -650px) scale(.15); }
  #dragon .dwing { transform-box: fill-box; animation: dflap 1.6s ease-in-out infinite alternate; }
  #dragon .dwing.l { transform-origin: right bottom; } #dragon .dwing.r { transform-origin: left bottom; }
  #dragon .smoke { animation: smoke 3s ease-out infinite; }
  #dragon .smoke:nth-of-type(2) { animation-delay: -1s; } #dragon .smoke:nth-of-type(3) { animation-delay: -2s; }
  #stage.shake #dragon .head { animation: roar .5s; }
  @keyframes dflap { from { transform: rotate(0); } to { transform: rotate(-9deg); } }
  #dragon .dwing.r { animation-name: dflapr; } @keyframes dflapr { from { transform: rotate(0); } to { transform: rotate(9deg); } }
  @keyframes smoke { from { transform: translate(0, 0) scale(.6); opacity: .8; } to { transform: translate(-30px, -90px) scale(1.6); opacity: 0; } }
  @keyframes roar { 50% { transform: translateY(-12px) rotate(-4deg); } }
  @keyframes pulse { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
  @keyframes bio { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @keyframes flow { to { stroke-dashoffset: -44; } }
  @keyframes drift { 0%,100% { transform: translate(0, 0); } 50% { transform: translate(18px, -30px); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.6vh); } }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.82); } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-14px); } 40%,80% { transform: translateX(14px); } }
  @keyframes rainbowglow { to { filter: hue-rotate(360deg); } }
  .sparkle { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; z-index: 3;
    box-shadow: 0 0 12px 5px var(--c, var(--gold)); pointer-events: none; animation: fly 1.3s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div id="title">FAIRY FOREST</div>
  <div id="hint">keys 1-5 = stations · R = reset</div>

  <svg id="scene"></svg>

  <!-- guide fairy: pastel 3D-cartoon style, feathered blue wings -->
  <div id="fairy">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <defs>
        <linearGradient id="f-wing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#64d4ff"/><stop offset=".6" stop-color="#2f5cf0"/><stop offset="1" stop-color="#1a2fa8"/></linearGradient>
        <radialGradient id="f-skin" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#fff2ea"/><stop offset="1" stop-color="#f3bfae"/></radialGradient>
        <linearGradient id="f-dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9fd2"/><stop offset="1" stop-color="#b24fd6"/></linearGradient>
        <linearGradient id="f-hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4fb0"/><stop offset="1" stop-color="#c0208a"/></linearGradient>
      </defs>
      <g class="wing l" fill="url(#f-wing)">
        <ellipse cx="38" cy="54" rx="7" ry="26" transform="rotate(-62 38 54)"/>
        <ellipse cx="40" cy="62" rx="7" ry="24" transform="rotate(-80 40 62)"/>
        <ellipse cx="42" cy="70" rx="6" ry="20" transform="rotate(-100 42 70)"/>
      </g>
      <g class="wing r" fill="url(#f-wing)">
        <ellipse cx="82" cy="54" rx="7" ry="26" transform="rotate(62 82 54)"/>
        <ellipse cx="80" cy="62" rx="7" ry="24" transform="rotate(80 80 62)"/>
        <ellipse cx="78" cy="70" rx="6" ry="20" transform="rotate(100 78 70)"/>
      </g>
      <path d="M50 70 Q60 62 70 70 L80 100 Q60 107 40 100Z" fill="url(#f-dress)"/>
      <circle cx="60" cy="48" r="17" fill="url(#f-skin)"/>
      <path d="M43 47 Q42 25 60 25 Q80 25 77 47 Q73 34 60 34 Q48 34 43 47Z" fill="url(#f-hair)"/>
      <path d="M58 26 Q66 14 76 18 Q68 20 64 30Z" fill="#4fe0ff"/>
      <path d="M46 36 Q60 28 74 36" stroke="#ffc844" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="31" r="3" fill="#7fe8ff"/>
      <ellipse cx="54" cy="50" rx="3.6" ry="4.6" fill="#2a1a4a"/><ellipse cx="66" cy="50" rx="3.6" ry="4.6" fill="#2a1a4a"/>
      <circle cx="55.2" cy="48.4" r="1.4" fill="#fff"/><circle cx="67.2" cy="48.4" r="1.4" fill="#fff"/>
      <ellipse cx="49" cy="56" rx="3" ry="1.8" fill="#ff7fae" opacity=".5"/><ellipse cx="71" cy="56" rx="3" ry="1.8" fill="#ff7fae" opacity=".5"/>
      <path d="M56 57 Q60 60 64 57" stroke="#8a3050" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="bubble">Waking up the magic…</div>

  <div id="overlay">Tap or press any key to wake the forest<small>(turns the sound on)</small></div>
</div>

<template id="scene-forest">
  <svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky-dark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0d0626"/><stop offset=".6" stop-color="#2a1352"/><stop offset="1" stop-color="#4a2270"/></linearGradient>
      <linearGradient id="sky-lit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5fb8ff"/><stop offset=".55" stop-color="#c9efff"/><stop offset="1" stop-color="#fff1c4"/></linearGradient>
      <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="ground-dark" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#3d2163"/><stop offset="1" stop-color="#1b0d30"/></linearGradient>
      <linearGradient id="ground-lit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a6e85c"/><stop offset=".5" stop-color="#5cc540"/><stop offset="1" stop-color="#2e8a30"/></linearGradient>
      <radialGradient id="canopy-dark" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#5b4bb0"/><stop offset=".55" stop-color="#2d2166"/><stop offset="1" stop-color="#150e38"/></radialGradient>
      <radialGradient id="canopy-lit" cx=".35" cy=".3" r=".8">
        <stop offset="0" stop-color="#e2ff92"/><stop offset=".5" stop-color="#6fcf3f"/><stop offset="1" stop-color="#2a7426"/></radialGradient>
      <linearGradient id="bark-dark" x1="0" x2="1"><stop offset="0" stop-color="#3f2e5e"/><stop offset="1" stop-color="#1c1230"/></linearGradient>
      <linearGradient id="bark-lit" x1="0" x2="1"><stop offset="0" stop-color="#c08a58"/><stop offset="1" stop-color="#6a4128"/></linearGradient>
      <radialGradient id="cap-dark" cx=".4" cy=".25" r=".9">
        <stop offset="0" stop-color="#a456c8"/><stop offset=".5" stop-color="#5a1f78"/><stop offset="1" stop-color="#2a0d40"/></radialGradient>
      <radialGradient id="cap-lit" cx=".4" cy=".25" r=".9">
        <stop offset="0" stop-color="#ffe0f1"/><stop offset=".45" stop-color="#ff5fae"/><stop offset="1" stop-color="#b8226f"/></radialGradient>
      <linearGradient id="stem-dark" x1="0" x2="1"><stop offset="0" stop-color="#9484c0"/><stop offset="1" stop-color="#4a3d70"/></linearGradient>
      <linearGradient id="stem-lit" x1="0" x2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#e6cfb4"/></linearGradient>
      <radialGradient id="rock-dark" cx=".4" cy=".3" r=".85">
        <stop offset="0" stop-color="#5e4f93"/><stop offset=".55" stop-color="#2e2558"/><stop offset="1" stop-color="#160f2e"/></radialGradient>
      <radialGradient id="rock-lit" cx=".4" cy=".3" r=".85">
        <stop offset="0" stop-color="#e3d6ff"/><stop offset=".55" stop-color="#9a86cc"/><stop offset="1" stop-color="#5b4a8c"/></radialGradient>
      <linearGradient id="water-dark" x1="0" x2="1">
        <stop offset="0" stop-color="#2e2660"/><stop offset=".5" stop-color="#55479a"/><stop offset="1" stop-color="#2e2660"/></linearGradient>
      <linearGradient id="water-lit" x1="0" x2="1">
        <stop offset="0" stop-color="#3cc8f5"/><stop offset=".5" stop-color="#e8fcff"/><stop offset="1" stop-color="#3cc8f5"/></linearGradient>
      <linearGradient id="cave-lit" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#ff9a4a"/></linearGradient>
      <radialGradient id="gold" cx=".35" cy=".3" r=".9">
        <stop offset="0" stop-color="#fff6c2"/><stop offset=".5" stop-color="#ffc844"/><stop offset="1" stop-color="#b8740f"/></radialGradient>
      <radialGradient id="g-glow"><stop offset="0" stop-color="#fff2a8" stop-opacity=".75"/>
        <stop offset=".5" stop-color="#9dffb0" stop-opacity=".3"/><stop offset="1" stop-color="#9dffb0" stop-opacity="0"/></radialGradient>
      <radialGradient id="g-sun"><stop offset="0" stop-color="#fffbe6"/><stop offset=".3" stop-color="#fff3b8" stop-opacity=".8"/>
        <stop offset="1" stop-color="#fff3b8" stop-opacity="0"/></radialGradient>
      <radialGradient id="g-moon"><stop offset="0" stop-color="#ffc8f4" stop-opacity=".7"/><stop offset="1" stop-color="#ffc8f4" stop-opacity="0"/></radialGradient>
      <filter id="blur-far" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="4"/></filter>
      <filter id="blur-ray"><feGaussianBlur stdDeviation="14"/></filter>
      <filter id="glowf" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

      <!-- shared silhouettes, painted twice (dark + lit) -->
      <g id="far-trees">
        <circle cx="20" cy="470" r="80"/><circle cx="120" cy="440" r="70"/><circle cx="210" cy="470" r="65"/>
        <circle cx="300" cy="430" r="80"/><circle cx="400" cy="460" r="60"/><circle cx="480" cy="430" r="75"/>
        <circle cx="580" cy="465" r="65"/><circle cx="1000" cy="455" r="70"/><circle cx="1090" cy="425" r="80"/>
        <circle cx="1190" cy="455" r="65"/><circle cx="1280" cy="420" r="85"/><circle cx="1380" cy="455" r="65"/>
        <circle cx="1470" cy="425" r="80"/><circle cx="1570" cy="460" r="75"/>
        <rect x="0" y="470" width="1600" height="120"/>
      </g>
      <path id="hill" d="M0 560 C260 500 520 530 800 505 C1080 480 1340 530 1600 500 L1600 900 L0 900Z"/>
      <path id="ground" d="M0 610 C300 575 560 600 800 585 C1060 570 1330 600 1600 580 L1600 900 L0 900Z"/>
    </defs>

    <!-- SKY -->
    <rect width="1600" height="900" fill="url(#sky-dark)"/>
    <g class="dark-bg">
      <circle cx="1180" cy="300" r="150" fill="url(#g-moon)"/>
      <circle cx="1180" cy="300" r="40" fill="#ffe6fb"/>
      <g fill="#fff">
        <circle cx="120" cy="90" r="2"/><circle cx="300" cy="160" r="1.5"/><circle cx="520" cy="70" r="2"/>
        <circle cx="760" cy="140" r="1.5"/><circle cx="980" cy="60" r="2.5"/><circle cx="1120" cy="200" r="1.5"/>
        <circle cx="220" cy="250" r="1.5"/><circle cx="640" cy="230" r="1"/><circle cx="1500" cy="320" r="2"/>
      </g>
    </g>
    <g class="lit-bg">
      <rect width="1600" height="900" fill="url(#sky-lit)"/>
      <circle cx="380" cy="40" r="300" fill="url(#g-sun)"/>
      <g filter="url(#blur-ray)" fill="url(#ray)" opacity=".85">
        <polygon points="330,0 430,0 760,620 600,620"/>
        <polygon points="460,0 520,0 960,560 860,560"/>
        <polygon points="250,0 300,0 420,640 330,640"/>
      </g>
    </g>

    <!-- RAINBOW (finale) -->
    <g id="rainbow" fill="none" stroke-width="22" stroke-linecap="round" opacity="0">
      <path d="M180 600 A620 520 0 0 1 1420 600" stroke="#ff6b8b"/>
      <path d="M202 600 A598 498 0 0 1 1398 600" stroke="#ffb35c"/>
      <path d="M224 600 A576 476 0 0 1 1376 600" stroke="#ffe66b"/>
      <path d="M246 600 A554 454 0 0 1 1354 600" stroke="#7ee08a"/>
      <path d="M268 600 A532 432 0 0 1 1332 600" stroke="#6bc8ff"/>
      <path d="M290 600 A510 410 0 0 1 1310 600" stroke="#b18cff"/>
    </g>

    <!-- FAR TREES + HILLS -->
    <use href="#far-trees" fill="#24164a" filter="url(#blur-far)"/>
    <use href="#far-trees" class="lit-bg" fill="#4f9a45" filter="url(#blur-far)"/>
    <use href="#hill" fill="#2b1850"/>
    <use href="#hill" class="lit-bg" fill="#78c74a"/>

    <!-- STATION 5: Fairy Throne (back center) -->
    <g class="zone" data-station="5"><g transform="translate(0 45)">
      <circle class="glow" cx="800" cy="380" r="190" fill="url(#g-glow)"/>
      <g class="dark">
        <path d="M725 450 L732 350 Q800 262 868 350 L875 450Z" fill="url(#rock-dark)"/>
        <ellipse cx="800" cy="452" rx="105" ry="24" fill="#24184a"/>
        <path d="M740 360 Q770 330 760 300 M860 360 Q835 330 845 300" stroke="#4b3a80" stroke-width="6" fill="none"/>
        <circle class="bio" cx="800" cy="318" r="9" fill="#6ffff0" filter="url(#glowf)"/>
      </g>
      <g class="lit">
        <path d="M725 450 L732 350 Q800 262 868 350 L875 450Z" fill="url(#gold)"/>
        <path d="M748 440 L752 360 Q800 300 848 360 L852 440Z" fill="#ff8cc6"/>
        <ellipse cx="800" cy="452" rx="105" ry="24" fill="#d99a2b"/>
        <path d="M735 352 Q700 320 712 285 M865 352 Q900 320 888 285" stroke="#3fae3c" stroke-width="7" fill="none" stroke-linecap="round"/>
        <g fill="#ff6fb5"><circle cx="712" cy="282" r="13"/><circle cx="888" cy="282" r="13"/></g>
        <g fill="#fff6c2"><circle cx="712" cy="282" r="5"/><circle cx="888" cy="282" r="5"/></g>
        <path d="M778 292 L788 268 L800 286 L812 268 L822 292Z" fill="#ffe066" filter="url(#glowf)"/>
        <circle cx="800" cy="318" r="10" fill="#7fe8ff" filter="url(#glowf)"/>
      </g>
      <text class="label" x="800" y="505">Fairy Throne</text>
    </g></g>

    <!-- DRAGON (dragon level only): grumpy pink dragon napping on the throne -->
    <g id="dragon"><g transform="translate(0 45) translate(800 470) scale(.8) translate(-800 -470)">
      <defs>
        <radialGradient id="d-skin" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#ffc9cf"/><stop offset=".6" stop-color="#f4869a"/><stop offset="1" stop-color="#c9506e"/></radialGradient>
        <linearGradient id="d-wing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bff3ee" stop-opacity=".95"/><stop offset="1" stop-color="#6fc9d6" stop-opacity=".8"/></linearGradient>
        <linearGradient id="d-horn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f8fc8"/><stop offset="1" stop-color="#b8f0ff"/></linearGradient>
      </defs>
      <path class="dwing l" d="M745 360 Q640 250 600 300 Q630 315 615 345 Q650 345 650 375 Q690 365 700 395Z" fill="url(#d-wing)" stroke="#5fb8c8" stroke-width="3"/>
      <path class="dwing r" d="M855 360 Q960 250 1000 300 Q970 315 985 345 Q950 345 950 375 Q910 365 900 395Z" fill="url(#d-wing)" stroke="#5fb8c8" stroke-width="3"/>
      <path d="M870 440 Q960 450 975 400 Q985 365 955 360" stroke="#e46f88" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M962 352 L985 340 L975 366Z" fill="#7fd8f0"/>
      <ellipse cx="800" cy="395" rx="92" ry="72" fill="url(#d-skin)"/>
      <ellipse cx="800" cy="412" rx="52" ry="52" fill="#ffe3da"/>
      <g fill="#f4869a"><ellipse cx="742" cy="455" rx="30" ry="16"/><ellipse cx="858" cy="455" rx="30" ry="16"/></g>
      <g fill="#8fdcf2"><circle cx="722" cy="464" r="6"/><circle cx="736" cy="467" r="6"/><circle cx="864" cy="467" r="6"/><circle cx="878" cy="464" r="6"/></g>

<script>
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), bubble = $('#bubble'), overlay = $('#overlay');
  let seenSeq = -1, audio = null, sceneName = null;

  // each adventure picks a scene template; dragon level reuses the forest
  function mountScene(name) {
    if (name === sceneName) return;
    sceneName = name;
    const t = document.getElementById('scene-' + name) || document.getElementById('scene-forest');
    $('#scene').replaceWith(t.content.cloneNode(true));
  }

  // --- sound: Web Audio tones, no files ---
  function tone(freq, t0, dur, type = 'sine', gain = .25) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur);
  }
  function chime() { if (!audio) return; const t = audio.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * .12, .5)); }
  function buzz() { if (!audio) return; tone(160, audio.currentTime, .4, 'sawtooth', .15); }
  function fanfare() { if (!audio) return; const t = audio.currentTime;
    [523, 523, 523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, t + i * .17, .6, 'triangle', .3)); }

  function wake() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    overlay.remove();
  }
  overlay.addEventListener('click', wake);

  // --- effects ---
  const SPARK = ['#ffd166', '#ff8fd0', '#7fe8ff', '#b18cff'];
  function sparkle(el, n = 28) {
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div'); s.className = 'sparkle';
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 200;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--c', SPARK[i % SPARK.length]);
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      stage.appendChild(s); setTimeout(() => s.remove(), 1400);
    }
  }
  function say(text, cls = '') { bubble.textContent = text; bubble.className = cls; }

  // --- state ---
  function render(st) {
    mountScene(st.scene === 'dragon' ? 'forest' : st.scene);
    document.querySelectorAll('.zone').forEach(z => {
      const n = +z.dataset.station;
      z.classList.toggle('healed', st.healed.includes(n));
    });
    stage.style.setProperty('--p', st.healed.length / st.stations.length);
    stage.classList.toggle('done', st.done);
    stage.classList.toggle('scene-dragon', st.scene === 'dragon');
    stage.classList.toggle('scene-mountain', st.scene === 'mountain');
    $('#title').textContent = st.title;
    document.querySelectorAll('.zone').forEach(z => {
      const name = st.spots[z.dataset.station]; if (name) z.querySelector('.label').textContent = name.replace(/^The /, '');
    });

    if (st.seq !== seenSeq) {
      const first = seenSeq === -1; seenSeq = st.seq;
      if (!first && st.event === 'heal') {
        const z = document.querySelector(`.zone[data-station="${st.healed.at(-1)}"]`);
        z.classList.add('just'); setTimeout(() => z.classList.remove('just'), 900);
        sparkle(z); chime();
        say(st.cheer.replace('{spot}', st.spots[st.healed.at(-1)].replace(/^The /, 'the ')).replace(/^the/, 'The'));
        setTimeout(() => say(st.clue), 2200);
        return;
      }
      if (!first && st.event === 'wrong') {
        stage.classList.add('shake'); setTimeout(() => stage.classList.remove('shake'), 600);
        buzz(); say(st.not_yet, 'wrong');
        setTimeout(() => say(st.clue), 3000);
        return;
      }
      if (!first && st.event === 'done') {
        document.querySelectorAll('.zone').forEach(z => sparkle(z)); fanfare();
        say(st.message, 'done');
        return;
      }
    }
    if (st.done) say(st.message, 'done');
    else if (st.message && st.healed.length === 0) say(st.message + ' ' + st.clue);
    else if (bubble.textContent.startsWith('Waking')) say(st.clue);
  }

  async function poll() {
    try { render(await (await fetch('/state')).json()); } catch (e) { say('Lost the magic… is the hub running?'); }
    setTimeout(poll, 400);
  }
  poll();

  // --- keyboard simulator (no hardware needed) ---
  const post = (p, body) => fetch(p, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  document.addEventListener('keydown', e => {
    if (overlay.isConnected) wake();
    if (e.key >= '1' && e.key <= '5') post('/hit', { station: +e.key, wand_id: 'keyboard' });
    if (e.key === 'r' || e.key === 'R') { seenSeq = -1; post('/reset'); }
  });
</script>
