  <text x="408" y="60" font-size="11" text-anchor="middle" fill="#444">Face panel: cut the solid outline and both windows. Tape the StickS3 (in its sleeve below) behind the screen window.</text>


  <text x="408" y="592" font-size="16" font-weight="700" text-anchor="middle" fill="#000" font-family="Avenir Next, Helvetica, sans-serif">Sleeve (1:1) for a 48 x 24 x 14 mm M5StickS3 body</text>
  <text x="408" y="610" font-size="11" text-anchor="middle" fill="#444">Solid = cut, dashed = fold. Dimensions are placeholders until the unit arrives (RECON NEEDED, see wargames/01). Print at 100 %, no scaling.</text>
  <text x="408" y="963.4" font-size="11" text-anchor="middle" fill="#444">Fold around the body, glue the tab to the back, cut the screen and IR windows. Slide the face panel in front and tape to a jar or box.</text>
  <text x="408" y="1030" font-size="10" text-anchor="middle" fill="#888">fairy-forest-wand · cards/cutouts/station-2.svg · letter 8.5 x 11 in</text>

